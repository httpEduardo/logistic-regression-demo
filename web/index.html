<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Logistic Regression Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Fira+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">Logistic regression</p>
        <h1>Logistic Regression Demo</h1>
        <p>Train weights and predict probabilities.</p>
      </header>
      <section class="panel">
        <textarea id="rowsInput" rows="7">[
  {"x1":0,"x2":0,"label":0},
  {"x1":0,"x2":1,"label":0},
  {"x1":1,"x2":0,"label":0},
  {"x1":1,"x2":1,"label":1}
]</textarea>
        <label>Sample row
          <input id="rowInput" value='{"x1":1,"x2":0}' />
        </label>
        <div class="grid">
          <label>Epochs <input id="epochsInput" type="number" value="400" /></label>
          <label>LR <input id="lrInput" type="number" step="0.05" value="0.1" /></label>
        </div>
        <div class="actions">
          <button id="trainButton">Train</button>
          <button id="predictButton" class="ghost">Predict</button>
        </div>
      </section>
      <section class="panel">
        <h2>Output</h2>
        <pre id="output"></pre>
      </section>
    </main>
    <div class="dock"></div>
    <script src="app.js"></script>
  </body>
</html>
